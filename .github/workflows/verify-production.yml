name: Verify portfolio production
on:
  push:
    paths: ['build.mjs', 'verify-site.py', '.github/workflows/verify-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser support
        run: |
          python -m pip install playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Inspect live desktop and mobile site
        run: python verify-site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: verification
          retention-days: 7
