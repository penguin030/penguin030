name: Restore remaining service screenshots
on:
  push:
    paths: ['.github/workflows/recover-extra.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Restore screenshots from existing public asset backups
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const root='public/assets';await fs.mkdir(root,{recursive:true});
          const report=[];
          const groups={weboneclick:['weboneclick','web-oneclick','web_oneclick','web','oneclick_web'],browseroneclick:['browseroneclick','browser-oneclick','browser_oneclick','browser','oneclick_browser'],mobile:['mobile','oneclick-mobile','oneclick_mobile','mobile-oneclick','oneclickmobile']};
          function typ(b){if(b.subarray(0,4).toString()==='RIFF'&&b.subarray(8,12).toString()==='WEBP')return'webp';if(b[0]===137&&b[1]===80&&b[2]===78&&b[3]===71)return'png';if(b[0]===255&&b[1]===216&&b[2]===255)return'jpg';return null;}
          await Promise.all(Object.entries(groups).map(async([name,aliases])=>{
            let found=false;const attempts=[];
            const paths=aliases.flatMap(a=>['webp','png','jpg','svg'].map(e=>a+'.'+e));
            for(const batch of [paths.map(p=>'https://hyojin-techlabs-assets.vercel.app/'+p)]){
              const results=await Promise.all(batch.map(async url=>{try{const r=await fetch(url,{signal:AbortSignal.timeout(8000)});attempts.push([url,r.status]);if(!r.ok)return null;let b=Buffer.from(await r.arrayBuffer()),ext=typ(b);if(!ext){const m=b.toString().match(/data:image\/(?:png|jpeg|webp);base64,([A-Za-z0-9+/=]+)/);if(m){b=Buffer.from(m[1],'base64');ext=typ(b);}}return ext?{url,b,ext}:null;}catch{return null;}}));
              const x=results.find(Boolean);if(x){await fs.writeFile(root+'/'+name+'.'+x.ext,x.b);report.push({name,source:x.url,bytes:x.b.length,path:root+'/'+name+'.'+x.ext});found=true;break;}
            }
            if(!found)report.push({name,missing:true,attempts});
          }));
          await fs.writeFile('extra-recovery-report.json',JSON.stringify(report,null,2));console.log(report.map(x=>({name:x.name,source:x.source,missing:x.missing})));
          JS
      - name: Commit recovered files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets extra-recovery-report.json
          git diff --cached --quiet || git commit -m 'Restore remaining OneClick screenshots from original backups'
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: all-portfolio-assets
          path: |
            public/assets
            extra-recovery-report.json
          retention-days: 7
